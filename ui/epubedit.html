<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EPUB 编辑 - ptoe</title>
<style>
:root{
  --accent:#3B6FFF;--accent-hover:#2D5AE0;--accent-soft:#E8EEFF;
  --border:#D8DEE6;--border-strong:#C4CCD8;
  --bg:#F4F6F9;--bg-elev:#FFFFFF;--bg-hover:#EEF2F7;--bg-active:#E1E8F0;
  --text:#1C2733;--text-muted:#5A6B7C;--text-dim:#8A97A6;
  --editor-font-size:14px;
  --toolbar-h:46px;--btn-size:26px;--radius:6px;--radius-sm:4px;
  --shadow-sm:0 1px 2px rgba(0,0,0,.06);--shadow-md:0 4px 12px rgba(0,0,0,.1);
  --glass-bg:rgba(255,255,255,.75);--glass-border:rgba(216,222,230,.6);
  --focus-ring:0 0 0 2px rgba(59,111,255,.35);
  --transition:0.15s ease;
}
*{box-sizing:border-box}
html,body{height:100%;}
body{margin:0;font-family:"Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;overflow:hidden;}
/* ---------- 顶部工具栏（玻璃拟态，同矫正界面视觉） ---------- */
#toolbar{
  position:sticky;top:0;z-index:20;flex:none;
  display:flex;align-items:center;gap:6px;
  min-height:var(--toolbar-h);padding:0 10px;
  background:var(--glass-bg);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--glass-border);
  flex-wrap:wrap;font-size:12px;
}
#toolbar .spacer{flex:1;}
#bookInfo{display:inline-flex;align-items:center;gap:8px;min-width:0;margin-right:4px;}
#bookTitle{font-size:15px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:300px;cursor:help;}
#bookAuthor{font-size:12px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px;}
#toolbar .tb-section{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
#toolbar .tb-left{flex:0 1 auto;min-width:0;}
#toolbar .tb-right{flex:0 0 auto;margin-left:auto;}
#toolbar .tb-group{
  display:inline-flex;align-items:center;gap:1px;
  padding:0 3px;height:32px;
  background:var(--bg-elev);border:1px solid var(--border);
  border-radius:var(--radius);white-space:nowrap;
  transition:background var(--transition),border-color var(--transition),box-shadow var(--transition);
}
#toolbar .tb-group:hover{background:var(--bg-hover);border-color:var(--border-strong);}
#toolbar .tb-group:focus-within{border-color:var(--accent);box-shadow:var(--focus-ring);}
#toolbar .ic-btn{
  width:var(--btn-size);height:var(--btn-size);padding:0;
  display:inline-flex;align-items:center;justify-content:center;
  border:none;background:transparent;color:var(--text);
  border-radius:var(--radius-sm);cursor:pointer;
  transition:background var(--transition),color var(--transition),transform .05s ease;
}
#toolbar .ic-btn:hover{background:var(--bg-hover);color:var(--accent);}
#toolbar .ic-btn:active{background:var(--bg-active);transform:scale(.96);}
#toolbar .ic-btn:focus-visible{outline:none;box-shadow:var(--focus-ring);}
#toolbar .ic-btn:disabled{opacity:.4;cursor:default;pointer-events:none;}
#toolbar .ic-btn.active{background:var(--accent-soft);color:var(--accent);}
#toolbar .ic-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
#toolbar .tb-btn{
  height:26px;padding:0 10px;
  border:1px solid var(--border);background:var(--bg-elev);color:var(--text);
  border-radius:var(--radius-sm);font:inherit;font-size:12px;cursor:pointer;
  transition:background var(--transition),border-color var(--transition),color var(--transition),transform .05s ease;
}
#toolbar .tb-btn:hover{background:var(--bg-hover);border-color:var(--border-strong);color:var(--accent);}
#toolbar .tb-btn:active{transform:scale(.98);}
#toolbar .tb-btn:focus-visible{outline:none;box-shadow:var(--focus-ring);}
#toolbar .tb-btn:disabled{opacity:.5;cursor:not-allowed;}
#toolbar .tb-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;}
#toolbar .tb-btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover);color:#fff;}
#toolbar .tb-btn.primary:disabled{background:var(--accent);opacity:.55;}
#toolbar .tb-btn.loading::after{content:'';display:inline-block;width:11px;height:11px;margin-left:8px;border:2px solid rgba(255,255,255,.45);border-top-color:#fff;border-radius:50%;animation:ptoe-spin .8s linear infinite;vertical-align:-2px;}
@keyframes ptoe-spin{to{transform:rotate(360deg);}}
/* 状态/路径行 */
#statusBar{
  flex:none;display:flex;align-items:center;gap:12px;
  padding:3px 14px;font-size:11px;color:var(--text-dim);
  background:var(--bg-elev);border-bottom:1px solid var(--border);
  white-space:nowrap;overflow:hidden;
}
#bookPath{overflow:hidden;text-overflow:ellipsis;cursor:help;}
#status{overflow:hidden;text-overflow:ellipsis;color:var(--text-muted);}
/* 两栏主体：左目录 / 右虚拟列表 */
#body{flex:1;display:flex;min-height:0;}
#tocPanel{
  flex:none;width:240px;min-width:240px;
  border-right:1px solid var(--border);background:var(--bg-elev);
  display:flex;flex-direction:column;min-height:0;
}
#tocHead{flex:none;padding:10px 14px 8px;font-size:13px;font-weight:700;color:var(--text);border-bottom:1px solid var(--border);}
#tocList{flex:1;overflow-y:auto;padding:6px 8px;min-height:0;}
.toc-item{display:flex;gap:6px;align-items:baseline;padding:6px 8px;font-size:13px;color:var(--text);border-radius:6px;cursor:pointer;user-select:none;line-height:1.4;}
.toc-item:hover{background:var(--bg-hover);}
.toc-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600;}
.toc-index{flex:none;color:var(--text-dim);font-size:12px;}
.toc-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}
#list{flex:1;overflow-y:auto;position:relative;min-width:0;overflow-anchor:none;}
#host{position:relative;min-height:100%;}
/* 文章行：绝对定位（虚拟列表），行内编辑标题 + 正文 */
.art-row{
  position:absolute;left:14px;right:14px;top:0;margin:0;
  background:var(--bg-elev);border:1px solid var(--border);border-radius:8px;
  padding:10px 14px;min-height:150px;
  box-shadow:var(--shadow-sm);
  transition:border-color var(--transition),box-shadow var(--transition);
}
.art-row.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);}
.art-head{display:flex;align-items:center;gap:8px;border-bottom:1px dashed var(--border);padding-bottom:6px;margin-bottom:8px;}
.art-num{flex:none;font-size:12px;font-weight:700;color:var(--text-muted);white-space:nowrap;}
.art-title{
  flex:1;min-width:0;font-size:15px;font-weight:700;color:var(--text);
  outline:none;padding:2px 4px;border-radius:4px;line-height:1.4;
}
.art-title:focus{box-shadow:var(--focus-ring);}
.art-remove{
  flex:none;height:24px;padding:0 10px;font-size:12px;color:var(--text-muted);
  border:1px solid var(--border);background:var(--bg-elev);border-radius:var(--radius-sm);cursor:pointer;
}
.art-remove:hover{border-color:#c0392b;color:#c0392b;background:#fdf1f1;}
.art-body{
  outline:none;padding:2px 4px;border-radius:4px;
  line-height:1.7;font-size:var(--editor-font-size);color:var(--text);min-height:60px;
}
.art-body:focus{box-shadow:var(--focus-ring);}
.art-body p{margin:.4em 0;}
/* 行内格式样式（与 EPUB 导出白名单一致的类名） */
.ptoe-underline{text-decoration:underline;}
.ptoe-underdot{border-bottom:1px dotted #333;}
.ptoe-strike{text-decoration:line-through;}
.ptoe-charbox{border:1px solid #333;padding:0 .15em;border-radius:2px;}
.ptoe-shade{background:#eef1f4;}
.ptoe-highlight{background:#e0e0e0;}
.ptoe-sup{vertical-align:super;font-size:.7em;line-height:1;}
.ptoe-sub{vertical-align:sub;font-size:.7em;line-height:1;}
.ptoe-note{font-size:12px;color:#556677;}
.ptoe-note p{font-size:12px;color:#556677;}
.ptoe-align-left{text-align:left;}
.ptoe-align-center{text-align:center;}
.ptoe-align-right{text-align:right;}
mark.ptoe-search{background:#ffe9a8;color:inherit;border-radius:2px;padding:0 1px;}
/* 空态提示（覆盖在列表区中央，不挡交互） */
#emptyState{
  display:none;position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);
  color:var(--text-muted);font-size:14px;pointer-events:none;z-index:5;
  background:var(--bg-elev);border:1px dashed var(--border-strong);border-radius:8px;
  padding:18px 26px;text-align:center;
}
/* ---------- 选中文字快捷菜单 ---------- */
#popup{
  position:fixed;z-index:60;display:none;flex-direction:column;gap:4px;
  max-width:360px;padding:6px 8px;background:#fff;border:1px solid var(--border);
  border-radius:8px;box-shadow:0 4px 18px rgba(0,0,0,.22);
}
#popup .pop-row{display:flex;gap:4px;align-items:center;}
.pop-btn{
  min-width:34px;height:30px;padding:0 8px;font-size:13px;
  border:1px solid var(--border);background:#fff;color:#1c2733;
  border-radius:6px;cursor:pointer;line-height:1;
}
.pop-btn:hover{background:#eef3fb;border-color:var(--accent);}
.pop-btn.active{background:#ffe9a8;outline:1px solid #d9a400;}
/* ---------- 右键上下文菜单 ---------- */
#contextMenu{
  position:fixed;z-index:80;display:flex;flex-direction:column;gap:1px;
  min-width:172px;max-width:240px;padding:5px;
  background:#fff;border:1px solid var(--border);border-radius:8px;
  box-shadow:0 6px 24px rgba(0,0,0,.22);
}
.ctx-item{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  width:100%;padding:7px 12px;border:none;background:transparent;
  color:#1c2733;font-size:13px;text-align:left;border-radius:5px;
  cursor:pointer;white-space:nowrap;font-family:inherit;
}
.ctx-item:hover{background:#eef3fb;color:var(--accent);}
.ctx-item:disabled{opacity:.45;cursor:default;}
.ctx-item:disabled:hover{background:transparent;color:#1c2733;}
.ctx-sep{height:1px;margin:3px 8px;background:var(--border);}
.ctx-sub{position:relative;}
.ctx-submenu{
  position:absolute;top:-5px;left:100%;margin-left:4px;min-width:150px;padding:5px;
  background:#fff;border:1px solid var(--border);border-radius:8px;
  box-shadow:0 6px 24px rgba(0,0,0,.22);display:none;
  flex-direction:column;gap:1px;z-index:81;
}
.ctx-sub.open > .ctx-submenu{display:flex;}
.ctx-submenu.ctx-left{left:auto;right:100%;margin-left:0;margin-right:4px;}
.ctx-submenu.ctx-up{top:auto;bottom:-5px;}
.ctx-submenu::before{content:'';position:absolute;top:0;bottom:0;left:-8px;width:8px;}
.ctx-submenu.ctx-left::before{left:auto;right:-8px;}
.ctx-caret{color:var(--text-dim);font-size:11px;}
.ctx-item[data-ctx="remove"]{color:#c0392b;}
.ctx-item[data-ctx="remove"]:hover{color:#c0392b;background:#fdf1f1;}
/* ---------- 搜索/替换模态框 ---------- */
#searchModalBg{
  position:fixed;inset:0;z-index:66;background:rgba(0,0,0,.35);
  display:none;align-items:center;justify-content:center;
}
.modal{
  background:var(--bg-elev);border-radius:10px;box-shadow:var(--shadow-md);
  width:560px;max-width:calc(100vw - 40px);max-height:80vh;
  display:flex;flex-direction:column;overflow:hidden;
}
.search-modal{padding:0;}
.modal-head{
  display:flex;align-items:center;padding:10px 14px;
  border-bottom:1px solid var(--border);font-weight:700;font-size:14px;
}
.modal-close{
  margin-left:auto;cursor:pointer;color:var(--text-muted);font-size:16px;
  line-height:1;padding:2px 6px;border-radius:4px;
}
.modal-close:hover{background:var(--bg-hover);color:var(--text);}
.search-row{display:flex;gap:8px;align-items:center;padding:8px 14px;flex-wrap:wrap;}
.search-row input[type=text], .search-row input[type=search]{
  flex:1;min-width:120px;height:28px;padding:0 8px;
  border:1px solid var(--border);border-radius:var(--radius-sm);
  background:var(--bg-elev);color:var(--text);font:inherit;
}
.search-row input[type=text]:focus, .search-row input[type=search]:focus{
  outline:none;border-color:var(--accent);box-shadow:var(--focus-ring);
}
.search-row label{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--text-muted);white-space:nowrap;}
.sr-count{padding:2px 14px;font-size:11px;color:var(--text-dim);}
.sr-list{flex:1;overflow-y:auto;min-height:90px;max-height:260px;padding:4px 14px 10px;}
.sr-empty{padding:18px 0;text-align:center;color:var(--text-dim);font-size:13px;}
.sr-item{padding:6px 8px;border-radius:6px;cursor:pointer;}
.sr-item:hover{background:var(--bg-hover);}
.sr-item.current{background:var(--accent-soft);}
.sr-item.current:hover{background:var(--accent-soft);}
.sr-page{font-size:11px;color:var(--accent);font-weight:600;margin-bottom:2px;}
.sr-ctx{font-size:12px;color:var(--text-muted);line-height:1.5;white-space:normal;word-break:break-all;}
.sr-ctx mark{background:#ffe9a8;color:inherit;border-radius:2px;padding:0 1px;}
.search-nav{display:flex;gap:8px;align-items:center;padding:8px 14px 12px;border-top:1px solid var(--border);}
.search-nav .tb-btn{height:26px;padding:0 10px;border:1px solid var(--border);background:var(--bg-elev);color:var(--text);border-radius:var(--radius-sm);font:inherit;font-size:12px;cursor:pointer;}
.search-nav .tb-btn:hover{background:var(--bg-hover);border-color:var(--border-strong);color:var(--accent);}
#searchPos{min-width:52px;text-align:center;font-size:12px;color:var(--text-muted);white-space:nowrap;}
/* Toast */
#toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;}
.toast{background:#1c2733;color:#fff;font-size:13px;line-height:1.5;padding:8px 16px;border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.25);opacity:0;transform:translateY(-6px);transition:opacity .2s,transform .2s;max-width:70vw;}
.toast.show{opacity:1;transform:translateY(0);}
.toast.ok{background:#1a7f37;}
.toast.fail{background:#c0392b;}
.toast.warn{background:#b45309;}
</style>
</head>
<body>
<div id="toolbar">
  <div class="tb-section tb-left">
    <div id="bookInfo">
      <span id="bookTitle"></span>
      <span id="bookAuthor"></span>
    </div>
    <div class="tb-group">
      <button type="button" class="ic-btn" data-op="undo" id="undoBtn" disabled title="撤回 (Ctrl+Z)" aria-label="撤回">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3 L2 6 L5 9"/><path d="M3 6h6a4 4 0 0 1 0 8H7"/></svg>
      </button>
      <button type="button" class="ic-btn" data-op="redo" id="redoBtn" disabled title="重做 (Ctrl+Y)" aria-label="重做">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M11 3 L14 6 L11 9"/><path d="M13 6H7a4 4 0 0 0 0 8h2"/></svg>
      </button>
    </div>
    <div class="tb-group">
      <button type="button" class="ic-btn" data-op="bold" title="加粗" aria-label="加粗"><svg viewBox="0 0 16 16" aria-hidden="true"><text x="8" y="12" text-anchor="middle" font-size="12" font-weight="700" fill="currentColor" stroke="none">B</text></svg></button>
      <button type="button" class="ic-btn" data-op="italic" title="斜体" aria-label="斜体"><svg viewBox="0 0 16 16" aria-hidden="true"><text x="8" y="12" text-anchor="middle" font-size="12" font-weight="700" fill="currentColor" stroke="none" font-style="italic">I</text></svg></button>
      <button type="button" class="ic-btn" data-op="heading" title="标题（正文内标题，不含一级标题）" aria-label="标题"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6h8M4 12h8M4 6v6M12 6v6"/></svg></button>
      <button type="button" class="ic-btn" data-op="p" title="正文" aria-label="正文"><svg viewBox="0 0 16 16" aria-hidden="true"><text x="8" y="12" text-anchor="middle" font-size="12" fill="currentColor" stroke="none">正</text></svg></button>
      <button type="button" class="ic-btn" data-op="remove" title="清除格式" aria-label="清除格式"><svg viewBox="0 0 16 16" aria-hidden="true"><text x="8" y="12" text-anchor="middle" font-size="12" fill="currentColor" stroke="none">清</text></svg></button>
      <button type="button" class="ic-btn" data-op="note" title="注释（小字灰字）" aria-label="注释"><svg viewBox="0 0 16 16" aria-hidden="true"><text x="8" y="12" text-anchor="middle" font-size="12" fill="currentColor" stroke="none">注</text></svg></button>
      <button type="button" class="ic-btn" data-op="highlight" title="突显" aria-label="突显"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="4" width="12" height="8" rx="1" style="fill:currentColor;fill-opacity:.25"/></svg></button>
      <button type="button" class="ic-btn" data-op="underdot" title="下加点" aria-label="下加点"><svg viewBox="0 0 16 16" aria-hidden="true"><text x="8" y="11" text-anchor="middle" font-size="11" fill="currentColor" stroke="none">u</text><circle cx="5" cy="13" r=".8" fill="currentColor" stroke="none"/><circle cx="8" cy="13.4" r=".8" fill="currentColor" stroke="none"/><circle cx="11" cy="13" r=".8" fill="currentColor" stroke="none"/></svg></button>
      <button type="button" class="ic-btn" data-op="sup" title="上标" aria-label="上标"><svg viewBox="0 0 16 16" aria-hidden="true"><text x="8" y="9" text-anchor="middle" font-size="12" fill="currentColor" stroke="none">上</text></svg></button>
      <button type="button" class="ic-btn" data-op="sub" title="下标" aria-label="下标"><svg viewBox="0 0 16 16" aria-hidden="true"><text x="8" y="15" text-anchor="middle" font-size="12" fill="currentColor" stroke="none">下</text></svg></button>
    </div>
    <div class="tb-group">
      <button type="button" class="ic-btn" data-op="align_left" title="左对齐" aria-label="左对齐"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 4h10M3 7.5h7M3 11h10"/></svg></button>
      <button type="button" class="ic-btn" data-op="align_center" title="居中" aria-label="居中"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 4h10M5 7.5h6M3 11h10"/></svg></button>
      <button type="button" class="ic-btn" data-op="align_right" title="右对齐" aria-label="右对齐"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 4h10M6 7.5h7M3 11h10"/></svg></button>
    </div>
    <div class="tb-group">
      <button type="button" class="ic-btn" data-op="t2s" title="繁体转简体" aria-label="繁体转简体"><svg viewBox="0 0 16 16" aria-hidden="true"><text x="8" y="12" text-anchor="middle" font-size="12" fill="currentColor" stroke="none">繁</text></svg></button>
      <button type="button" class="ic-btn" data-op="s2t" title="简体转繁体" aria-label="简体转繁体"><svg viewBox="0 0 16 16" aria-hidden="true"><text x="8" y="12" text-anchor="middle" font-size="12" fill="currentColor" stroke="none">简</text></svg></button>
      <button type="button" class="ic-btn" data-op="clean" title="智能清理" aria-label="智能清理"><svg viewBox="0 0 16 16" aria-hidden="true"><text x="8" y="12" text-anchor="middle" font-size="12" fill="currentColor" stroke="none">理</text></svg></button>
      <button type="button" class="ic-btn" data-op="search" id="searchOpenBtn" title="搜索替换（当前章）" aria-label="搜索替换"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="6.5" cy="6.5" r="4"/><path d="M9.5 9.5 L14 14"/></svg></button>
    </div>
  </div>
  <div class="spacer"></div>
  <div class="tb-section tb-right">
    <div class="tb-group">
      <button id="addBtn" class="tb-btn" data-op="addArticle" title="在末尾新增一章（一级标题 + 空正文）">新增一级标题</button>
      <button id="saveBtn" class="tb-btn primary" data-op="save" title="保存整个 EPUB（POST /api/save）">保存 EPUB</button>
    </div>
  </div>
</div>
<div id="statusBar">
  <span id="bookPath"></span>
  <span id="status"></span>
</div>
<div id="body">
  <aside id="tocPanel">
    <div id="tocHead">目录</div>
    <div id="tocList"></div>
  </aside>
  <main id="list">
    <div id="host"></div>
    <div id="emptyState">本书暂无章节，点击「新增一级标题」开始编辑</div>
  </main>
</div>
<div id="popup" hidden></div>
<div id="contextMenu" hidden>
  <button type="button" class="ctx-item" data-ctx="add">新增一级标题</button>
  <button type="button" class="ctx-item" data-ctx="remove" id="ctxRemoveBtn">取消一级标题</button>
  <div class="ctx-sep"></div>
  <button type="button" class="ctx-item" data-ctx="bold">加粗</button>
  <button type="button" class="ctx-item" data-ctx="italic">斜体</button>
  <button type="button" class="ctx-item" data-ctx="heading">标题</button>
  <button type="button" class="ctx-item" data-ctx="p">正文</button>
  <button type="button" class="ctx-item" data-ctx="removefmt">清除格式</button>
  <button type="button" class="ctx-item" data-ctx="note">注释</button>
  <div class="ctx-item ctx-sub"><span>对齐</span><span class="ctx-caret">▸</span>
    <div class="ctx-submenu">
      <button type="button" class="ctx-item" data-ctx="align_left">左对齐</button>
      <button type="button" class="ctx-item" data-ctx="align_center">居中</button>
      <button type="button" class="ctx-item" data-ctx="align_right">右对齐</button>
    </div>
  </div>
  <button type="button" class="ctx-item" data-ctx="sup">上标</button>
  <button type="button" class="ctx-item" data-ctx="sub">下标</button>
  <div class="ctx-sep"></div>
  <button type="button" class="ctx-item" data-ctx="search">搜索替换</button>
  <button type="button" class="ctx-item" data-ctx="t2s">繁体转简体</button>
  <button type="button" class="ctx-item" data-ctx="s2t">简体转繁体</button>
  <button type="button" class="ctx-item" data-ctx="clean">智能清理</button>
  <div class="ctx-sep"></div>
  <button type="button" class="ctx-item" data-ctx="save">保存 EPUB</button>
</div>
<div id="searchModalBg">
  <div class="modal search-modal">
    <div class="modal-head">搜索替换（当前章）<span class="modal-close" id="searchCloseBtn" title="关闭">✕</span></div>
    <div class="search-row">
      <input type="search" id="searchInput" placeholder="输入搜索词…">
      <label><input type="checkbox" id="searchRegex">正则</label>
      <button type="button" class="tb-btn" id="searchBtn">搜索</button>
    </div>
    <div id="srCount" class="sr-count"></div>
    <div id="searchList" class="sr-list"></div>
    <div class="search-row">
      <input type="text" id="replaceInput" placeholder="替换为…">
      <button type="button" class="tb-btn" id="replaceBtn">替换当前</button>
      <button type="button" class="tb-btn" id="replaceAllBtn">全部替换</button>
    </div>
    <div class="search-nav">
      <button type="button" class="tb-btn" id="searchPrevBtn">上一个</button>
      <span id="searchPos"></span>
      <button type="button" class="tb-btn" id="searchNextBtn">下一个</button>
      <span class="spacer" style="flex:1"></span>
      <button type="button" class="tb-btn" id="searchClearBtn">清理</button>
    </div>
  </div>
</div>
<div id="toast"></div>
<script src="/ui/epubedit.js"></script>
</body>
</html>
